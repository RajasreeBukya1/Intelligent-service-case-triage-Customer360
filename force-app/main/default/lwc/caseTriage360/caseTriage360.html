<template>
    <lightning-card title="Intelligent Case Triage & Customer 360" icon-name="standard:case">
        <div class="slds-p-around_medium">
            <template if:true={loading}><lightning-spinner alternative-text="Loading"></lightning-spinner></template>
            <template if:true={errorMessage}><div class="slds-text-color_error slds-m-bottom_small">{errorMessage}</div></template>
            <template if:true={result}>
                <div class="slds-grid slds-wrap slds-gutters">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <div class="slds-box">
                            <p class="slds-text-title_caps">Intent</p><p class="metric">{result.intent}</p>
                            <p class="slds-text-title_caps">Urgency</p><p class="metric">{result.urgencyScore}/100</p>
                            <p class="slds-text-title_caps">Recommended Priority</p><p>{result.recommendedPriority}</p>
                            <p class="slds-text-title_caps">Queue</p><p>{result.recommendedQueue}</p>
                            <p class="slds-text-title_caps">Confidence</p><p>{confidencePercent}%</p>
                            <p class="slds-m-top_small">{result.reason}</p>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <div class="slds-box">
                            <p class="slds-text-heading_small">Customer 360</p>
                            <p><b>Account:</b> {result.customer360.accountName}</p>
                            <p><b>Lifetime value:</b> {result.customer360.lifetimeValue}</p>
                            <p><b>Open cases:</b> {result.customer360.openCaseCount}</p>
                            <p><b>Recent orders:</b> {result.customer360.recentOrderCount}</p>
                            <p><b>Churn risk:</b> {churnRiskPercent}%</p>
                            <p><b>Preferred channel:</b> {result.customer360.preferredChannel}</p>
                            <p><b>Source:</b> {result.customer360.source}</p>
                        </div>
                    </div>
                </div>
                <div class="slds-box slds-m-top_medium">
                    <p class="slds-text-heading_small">Recommended Next Actions</p>
                    <template for:each={result.recommendations} for:item="recommendation">
                        <div key={recommendation} class="slds-p-vertical_x-small">• {recommendation}</div>
                    </template>
                </div>
            </template>
            <div class="slds-m-top_medium">
                <lightning-button variant="brand" label="Run & Save Triage" onclick={handleRun}></lightning-button>
                <lightning-button class="slds-m-left_small" label="Refresh" onclick={handleRefresh}></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
